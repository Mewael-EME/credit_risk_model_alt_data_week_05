version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - MODEL_URI=models:/best_credit_model/production
  dashboard:
    build: .
    command: streamlit run src/apps/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports: ["8501:8501"]
    environment:
      - MODEL_URI=models:/best_credit_model/production
